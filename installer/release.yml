# Выпуск MacroKit: пуш тега vX.Y.Z → сборка → установщик → релиз на GitHub.
#
# Этот файл должен лежать в .github/workflows/release.yml. Токен, которым
# работает Claude, не может менять workflow-файлы (нет scope workflow),
# поэтому туда его кладёт пользователь через веб-интерфейс GitHub —
# так же, как в aion-config. Здесь — эталонная копия.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Тег совпадает с файлом VERSION
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $file = (Get-Content VERSION -Raw).Trim()
          if ($tag -ne $file) { throw "Тег v$tag, а в VERSION — $file. Поднять VERSION и перевыпустить тег." }
          "APP_VERSION=$file" >> $env:GITHUB_ENV

      - name: Сборка MacroKit.exe и SmokeTest.exe
        shell: powershell
        run: .\build.ps1

      - name: Установщик
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $iscc "/DAppVersion=$env:APP_VERSION" installer\MacroKit.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Релиз на GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $setup = "dist\MacroKit-Setup-$env:APP_VERSION.exe"
          $text = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $m = [regex]::Match($text, "(?ms)^## $([regex]::Escape($env:APP_VERSION))[^\n]*\n(.*?)(?=^## |\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "MacroKit $env:APP_VERSION" }
          Set-Content -Path notes.md -Value $notes -Encoding utf8

          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $setup --clobber
            gh release edit $env:GITHUB_REF_NAME --notes-file notes.md
          } else {
            gh release create $env:GITHUB_REF_NAME $setup --title "MacroKit $env:APP_VERSION" --notes-file notes.md
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
